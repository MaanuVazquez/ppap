name: Release Windows x64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build and release Windows x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Embed client build
        run: |
          rm -rf server/internal/web/static
          mkdir -p server/internal/web/static
          cp -R client/dist/. server/internal/web/static/

      - name: Test server
        working-directory: server
        run: go test ./...

      - name: Build Windows x64 binary
        working-directory: server
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w" -o ../dist/ppap-server-windows-amd64.exe ./cmd/ppap-server

      - name: Package release asset
        run: |
          cp README.md dist/README.md
          cd dist
          zip -9 ppap-server-windows-amd64.zip ppap-server-windows-amd64.exe README.md
          shasum -a 256 ppap-server-windows-amd64.zip ppap-server-windows-amd64.exe > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ppap-server-windows-amd64
          path: |
            dist/ppap-server-windows-amd64.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/ppap-server-windows-amd64.zip \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/ppap-server-windows-amd64.zip \
              dist/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "PPAP $RELEASE_TAG" \
              --notes "Windows x64 MVP build."
          fi
